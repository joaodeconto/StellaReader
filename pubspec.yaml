name: stellareader
description: "A simple Android PDF and EPUB reader."
publish_to: 'none'
version: 0.4.2+12

# Matches the floor recorded in pubspec.lock, which is what CI resolves
# against on the stable channel. Declaring an older floor made the committed
# lockfile unusable on the SDKs it claimed to support.
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: any
  go_router: any
  pdfx: any
  sqflite: any
  path_provider: any
  file_picker: any
  epub_view: any
  universal_io: any
  dio: any
  path: any
  xml: ^6.5.0
  package_info_plus: ^8.3.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  receive_sharing_intent: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
